name: CLI Test Coverage

on:
  push:
    branches: [ main ]
    paths:
      - 'deno/cli/**'
      - '.github/workflows/cli-coverage.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'deno/cli/**'

jobs:
  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Run tests with coverage
      working-directory: deno/cli
      run: deno task test:coverage

    - name: Generate LCOV report
      working-directory: deno/cli
      run: deno task coverage:report

    - name: Extract coverage percentage
      id: coverage
      working-directory: deno/cli
      run: |
        # Extract coverage percentage from LCOV file
        if [ -f coverage.lcov ]; then
          # Calculate coverage percentage from LCOV
          LINES_FOUND=$(grep -c "^LF:" coverage.lcov || echo "0")
          LINES_HIT=$(grep -c "^LH:" coverage.lcov || echo "0")

          if [ "$LINES_FOUND" -gt 0 ]; then
            # Sum all LF and LH values
            TOTAL_LINES=$(grep "^LF:" coverage.lcov | cut -d: -f2 | awk '{sum += $1} END {print sum}')
            HIT_LINES=$(grep "^LH:" coverage.lcov | cut -d: -f2 | awk '{sum += $1} END {print sum}')

            if [ "$TOTAL_LINES" -gt 0 ]; then
              COVERAGE=$(echo "scale=1; $HIT_LINES * 100 / $TOTAL_LINES" | bc)
            else
              COVERAGE="0"
            fi
          else
            COVERAGE="0"
          fi
        else
          COVERAGE="0"
        fi

        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "CLI Coverage: $COVERAGE%"

    - name: Create coverage badge
      run: |
        COVERAGE="${{ steps.coverage.outputs.coverage }}"

        # Determine badge color based on coverage
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"
        else
          COLOR="red"
        fi

        # Create badge directory
        mkdir -p badges/cli

        # Generate badge SVG using shields.io
        curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > badges/cli/coverage.svg

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./badges
        destination_dir: badges
        keep_files: true

  comment-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: coverage

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Collect coverage data
      id: collect
      run: |
        cd deno/cli

        deno task test:coverage > /dev/null 2>&1
        deno task coverage:report > /dev/null 2>&1

        if [ -f coverage.lcov ]; then
          TOTAL_LINES=$(grep "^LF:" coverage.lcov | cut -d: -f2 | awk '{sum += $1} END {print sum}')
          HIT_LINES=$(grep "^LH:" coverage.lcov | cut -d: -f2 | awk '{sum += $1} END {print sum}')

          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$(echo "scale=1; $HIT_LINES * 100 / $TOTAL_LINES" | bc)
          else
            COVERAGE="0"
          fi

          COVERAGE_REPORT="## 📊 CLI Test Coverage Report\n\n**Coverage**: ${COVERAGE}%\n\n*Generated by GitHub Actions*"
        else
          COVERAGE_REPORT="## 📊 CLI Test Coverage Report\n\n**Coverage**: N/A\n\n*Generated by GitHub Actions*"
        fi

        echo "COVERAGE_REPORT<<EOF" >> $GITHUB_OUTPUT
        echo -e "$COVERAGE_REPORT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Comment coverage on PR
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${{ steps.collect.outputs.COVERAGE_REPORT }}`
          })
