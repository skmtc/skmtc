# Release via the cascade script, publishing to public jsr.io
# authenticated with GitHub OIDC (no registry token). `@skmtc/core` and
# `@skmtc/vite` are additionally published to npm in the same job (also via
# OIDC — npm Trusted Publishing). `@skmtc/vite` is a pnpm/node package (not
# dnt): its step installs deps, builds `dist/` with tsdown, then publishes.
#
# Runs automatically on every merge to main, except pushes that touch
# only paths listed under `paths-ignore` below (retros, notes, assets,
# root docs): the cascade publishes any workspace package whose
# deno.json version isn't yet on the registry and skips everything
# already published, so merges with no version bumps are a no-op
# ("nothing to publish"). Bump versions with `deno task bump <package>`
# and merge — that IS the release.
#
# After a failed Publish, re-run it with workflow_dispatch
# (already-published packages are skipped on re-run). A later retro or
# docs-only merge does not retry it, and neither does an empty commit:
# GitHub starts no run for a push with no changed files once a path
# filter is set.
#
# Private packages (`"private": true` in deno.json) are bumped by the
# cascade but never published — publish those manually to the local
# mirror when needed.
#
# OIDC requires the `id-token: write` permission below AND, for JSR, each
# published @skmtc/* package on jsr.io to be linked to this GitHub
# repository in its package settings. For npm, both `@skmtc/core` and
# `@skmtc/vite` must list this repo + this workflow (publish.yml) as a
# Trusted Publisher in their npmjs.com package settings — configure that
# BEFORE merging a version bump, or the npm step fails after the JSR release
# has already shipped. Each npm step self-skips once npm holds the current
# package.json version (registry-truth), so re-runs and no-bump merges are
# safe. (`@skmtc/vite`'s version is its `package.json` version, independent
# of the JSR cascade.)

name: Publish

on:
  push:
    branches: [main]
    # Nothing under these paths feeds a published package.
    paths-ignore:
      - 'retros/**'
      - 'notes/**'
      - 'assets/**'
      - 'autoresearch/**'
      - 'README.md'
      - 'RESUME.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Stays GitHub-hosted while coverage runs on Blacksmith: npm Trusted
    # Publishing accepts only an OIDC token minted on a cloud-hosted GitHub
    # runner, so the `--provenance` publishes below fail on a third-party one.
    # JSR is not the constraint here; npm is.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Release via cascade to jsr.io
        working-directory: deno
        run: deno task release

      # --- npm publish for @skmtc/core (OIDC / Trusted Publishing) ---
      # dnt builds the npm package with pnpm; node/npm publish it. npm
      # Trusted Publishing needs npm >= 11.5.1, newer than what ships with
      # setup-node, so we upgrade npm globally before publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Version comes from the root package.json `packageManager` field;
      # setting it here too would conflict (ERR_PNPM_BAD_PM_VERSION).
      - name: Setup pnpm (dnt build)
        uses: pnpm/action-setup@v4

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Publish @skmtc/core to npm (if behind)
        working-directory: deno/core
        run: deno task publish:npm-if-needed

      # --- npm publish for @skmtc/vite (OIDC / Trusted Publishing) ---
      # The Vite preview plugin is a pnpm/node package: install its deps, build
      # dist/ with tsdown (ESM + d.ts; the browser render harness ships as
      # source), then publish only when npm is behind. package.json `version`
      # is the source of truth — the step self-skips when npm already has it.
      - name: Install @skmtc/vite deps
        run: pnpm install --filter @skmtc/vite --frozen-lockfile

      - name: Publish @skmtc/vite to npm (if behind)
        working-directory: packages/vite
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version 2>/dev/null | grep -q .; then
            echo "$NAME@$VERSION already on npm — nothing to publish."
          else
            echo "npm is behind — building and publishing $NAME@$VERSION..."
            pnpm build
            npm publish --access public --provenance
          fi
