# Release via the cascade script, publishing to public jsr.io
# authenticated with GitHub OIDC (no registry token).
#
# Runs automatically on every merge to main: the cascade publishes any
# workspace package whose deno.json version isn't yet on the registry
# and skips everything already published, so merges with no version
# bumps are a no-op ("nothing to publish"). Bump versions with
# `deno task bump <package>` and merge — that IS the release. The
# workflow_dispatch trigger remains for manual re-runs (e.g. after a
# partial failure; already-published packages are skipped on re-run).
#
# Private packages (`"private": true` in deno.json) are bumped by the
# cascade but never published — publish those manually to the local
# mirror when needed.
#
# OIDC requires the `id-token: write` permission below AND each
# published @skmtc/* package on jsr.io to be linked to this GitHub
# repository in its package settings.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Release via cascade to jsr.io
        working-directory: deno
        run: deno task release
