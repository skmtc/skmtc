name: Test Coverage

on:
  push:
    branches: [main]
    paths:
      - 'deno/**'
      # The skills catalogue check reads this manifest, so a PR that only
      # edits it has to run the gate that would catch the disagreement.
      - '.claude-plugin/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deno/**'
      - '.claude-plugin/**'

jobs:
  coverage:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    # No JSR_URL override: everything resolves from public jsr.io.
    # @skmtc/* has published there since 2026-07-05 (the publish
    # workflow), and every pinned version in deno.lock exists there
    # (verified with a cold cache). The old jsr.skmtc.co.uk override
    # made CI silently depend on a dev-machine tunnel being up — 530s
    # whenever it wasn't.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify docs sync (skill chain + discrepancy catalog)
        working-directory: deno
        run: deno task verify-docs

      - name: Run tests with coverage
        working-directory: deno
        run: deno task test:coverage

      - name: Generate LCOV report
        working-directory: deno
        run: deno task coverage:report

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: deno/coverage.lcov

  # Windows is a supported host for the CLI and the engine, and its path
  # separator is the one difference the Ubuntu job can never exercise
  # (issue #147: OS-native joins leaking `\` into generated import text).
  # No coverage upload from here: the Ubuntu job owns that.
  tests-windows:
    runs-on: windows-latest

    steps:
      # The runner's git defaults to core.autocrlf=true, which would
      # rewrite every checked-out file to CRLF and skew snapshot and
      # doc-test comparisons. The repository is LF everywhere.
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests
        working-directory: deno
        run: deno test --allow-all
