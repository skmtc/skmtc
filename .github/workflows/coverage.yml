name: Test Coverage

on:
  push:
    branches: [ main ]
    paths:
      - 'deno/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'deno/**'

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      # Workspace `jsr:@skmtc/*` pins (and @std/*) resolve against the
      # skmtc registry, not public jsr.io — the @skmtc versions only
      # exist there. Deno honors JSR_URL for `jsr:` import resolution.
      JSR_URL: https://jsr.skmtc.co.uk/

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Verify docs sync (skill chain + discrepancy catalog)
      working-directory: deno
      run: deno task verify-docs

    - name: Run tests with coverage
      working-directory: deno
      run: deno task test:coverage

    - name: Generate LCOV report
      working-directory: deno
      run: deno task coverage:report

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: deno/coverage.lcov
